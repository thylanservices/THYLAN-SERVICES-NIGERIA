<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Quote | THYLAN SERVICES NIGERIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
<div class="container">
<div class="logo-box">
<img src="images/logo.png">
<div>
<h1>THYLAN SERVICES NIGERIA</h1>
<p>Powering Solutions, Simplifying Lives</p>
</div>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="projects.html">Projects</a>
<a href="contact.html">Contact</a>
</nav>
</div>
</header>

<section class="page-title">
<h2>Request a Free Quote</h2>
<p>Tell us about your project</p>
</section>

<section class="quote-form">

<form action="https://formsubmit.co/info@thylanservicesnigeria.com.ng" method="POST">

<input type="hidden" name="_subject" value="New Quote Request - THYLAN SERVICES NIGERIA">

<input type="hidden" name="_captcha" value="false">

<input type="text" name="Name" placeholder="Full Name" required>

<input type="tel" name="Phone" placeholder="Phone Number" required>

<input type="email" name="Email" placeholder="Email Address" required>

<select name="Service" required>
<option value="">Select Service</option>
<option>Solar Installation</option>
<option>CCTV Installation</option>
<option>LAN Networking</option>
<option>Software Development</option>
<option>Website Development</option>
<option>ICT Consultancy</option>
</select>

<textarea name="Project" rows="6" placeholder="Describe your project" required></textarea>

<button type="submit">Request My Quote</button>

</form>
</section>

<script src="script.js"></script>

</body>
</html>
